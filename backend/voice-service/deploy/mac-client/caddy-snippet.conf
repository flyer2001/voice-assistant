# Caddy snippet for voice-agent-mac loop.
# Splice into the existing host block for cashflow-game.ru (or your public host):
#
#   handle /v1/voice/* {
#       reverse_proxy 10.10.0.1:8089   # WireGuard internal IP of voice-backend
#   }
#   handle /voice-out/* {
#       header Access-Control-Allow-Origin "*"
#       header Access-Control-Allow-Methods "GET, OPTIONS"
#       root * /srv
#       file_server browse
#   }
#
# Notes:
# - /v1/voice/* — reverse proxy to voice-backend service (VOICE_HOST:8089).
# - /voice-out/* — serves TTS replies from /srv/voice-out/{stem}.mp3+.json
#   which the mac client polls.
# - Do NOT add auth on /voice-out/*: stems are unguessable timestamped IDs +
#   the payload is a spoken response, not a secret.
# - /srv/voice-out/ must exist and be writable by the user running the wrappers.
